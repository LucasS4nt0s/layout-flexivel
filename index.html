<!DOCTYPE html>
<html lang="pr-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Flexível</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="menu-login">

        <div class="container">

            <header class="header">
                <img class="logo" src="assets/riot-logo.png" alt="Logo da Riot Games">
            </header>

            <main class="login">

                <span> SIGN IN </span>

                <label for="nome"> Digite seu nome:</label>
                <input type="text" id="nome" name="nome" placeholder="war D3N00">

                <label for="senha"> Digite sua senha:</label>
                <input type="text" id="senha" name="senha" placeholder="PASSEWORD">

                <div class="resgate">
                    <span> Remember Me </span>
                    <span> Forgot Passeword </span>
                </div>

                <button> SIGN IN </button>

                <p> Don't have an account? <span class="sign"> Sign Up</span></p>
                <span>Or Sign In With</span>

                <div class="opcoes">
                    <button type="button">Google</button>
                    <button type="button">Gamer</button>
                </div>

            </main>
        </div>
    </div>
</body>

</html>
